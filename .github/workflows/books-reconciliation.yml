name: Books reconciliation
# Checks every business on the native ledger once a day (Doc 09 §6, TEST-402) at 02:30 Lagos time. Off until the
# repository variable CACU_BOOKS_RECONCILIATION_ENABLED is 'true'; a manual run is a dry run unless "apply" is ticked.
# The run fails when any business's books disagree, so the failure shows here and in GitHub's notifications.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Check the books and record the results (read-only for the books)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: books-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || vars.CACU_BOOKS_RECONCILIATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: billing-operations
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: uv sync --frozen --no-editable
      - name: Check the books or dry run
        env:
          CACU_DATABASE_URL: ${{ secrets.CACU_DATABASE_URL }}
          APPLY_RECONCILIATION: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY_RECONCILIATION" = "true" ]; then
            uv run --frozen python -m tools.reconcile_books --apply --json
          else
            uv run --frozen python -m tools.reconcile_books --json
          fi
