name: CACU CI/CD Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "fix/**" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: non-secret-test-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI Suite (Lint, Typecheck, Tests)
        run: npm run ci
        env:
          SKIP_ENV_VALIDATION: true

      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - name: Validate Build
        run: npm run build

  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cacu_accounting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      CACU_SETUP_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/cacu_setup_test
      CACU_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/cacu_accounting_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
      - run: uv lock --check
      - run: uv sync --frozen --no-editable
      - name: Create isolated setup test database
        run: >-
          uv run --frozen python -c "import os, psycopg;
          connection = psycopg.connect(os.environ['CACU_TEST_DATABASE_URL'], autocommit=True);
          connection.execute('CREATE DATABASE cacu_setup_test'); connection.close()"
      - run: uv run --frozen python -m pytest
