  "fastapi==0.143.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "hypothesis==6.131.9",
  "idna==3.20",
  "iniconfig==2.3.1",
  "mysqlclient==2.3.0",
  "opentelemetry-api==1.45.1",
  "packaging==26.3",
  "pluggy==1.6.0",
  "psycopg==3.2.9",
  "psycopg-binary==3.2.9",
  "psycopg2==2.9.13",
  "pydantic==2.11.4",
  "pydantic_core==2.33.2",
  "Pygments==2.21.0",
  "pytest==9.1.1",
