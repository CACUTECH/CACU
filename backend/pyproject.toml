[project]
name = "cacu-accounting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.143.0", "pydantic==2.11.4", "httpx==0.28.1", "psycopg[binary]==3.2.9", "uvicorn==0.34.2", "python-accounting==1.0.1", "SQLAlchemy==2.1.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app:app"
[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.131.9"]

[tool.uv]
constraint-dependencies = [
